name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even if the image tag already exists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cal-patches
  # Pushing needs a token with packages:write; pull requests from forks only verify.
  CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  verify:
    name: Apply, test and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Free disk space for the Cal.com install
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: scripts/verify.sh

  build:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      pushed: ${{ steps.ref.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the Cal.com build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - if: env.CAN_PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        env:
          FORCE: ${{ inputs.force }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(scripts/image-tag.sh)"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if [ "$CAN_PUSH" = true ] && [ "$FORCE" != true ] &&
            skopeo inspect --creds "$GH_ACTOR:$GH_TOKEN" "docker://$IMAGE:$tag" >/dev/null 2>&1; then
            echo "$IMAGE:$tag already exists; skipping the build"
            echo "exists=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.existing.outputs.exists != 'true'
        run: scripts/build.sh

      - name: Push
        if: steps.existing.outputs.exists != 'true' && env.CAN_PUSH == 'true'
        env:
          TAG: ${{ steps.existing.outputs.tag }}
        run: docker push "$IMAGE:$TAG"

      - name: Resolve digest
        id: ref
        if: env.CAN_PUSH == 'true'
        env:
          TAG: ${{ steps.existing.outputs.tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest="$(skopeo inspect --creds "$GH_ACTOR:$GH_TOKEN" --format '{{.Digest}}' "docker://$IMAGE:$TAG")"
          echo "ref=$IMAGE:$TAG@$digest" >>"$GITHUB_OUTPUT"
          echo "pushed=true" >>"$GITHUB_OUTPUT"
          echo "### Image" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:$TAG@$digest" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"

  screenshots:
    name: Screenshots (dummy data)
    needs: build
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright
        working-directory: screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Capture upstream, patched with the flag off, patched with the flag on
        env:
          PATCHED: ${{ needs.build.outputs.ref }}
        run: |
          source upstream.env
          screenshots/run.sh "calcom/cal.com:$CAL_VERSION" upstream "" 0 shots
          screenshots/run.sh "$PATCHED" patched-flag-off "" 0 shots
          screenshots/run.sh "$PATCHED" patched-flag-on true 1 shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
